<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة لعبني ومتعني - نظام الأونلاين المطور</title>

    <meta property="og:title" content="لعبة لعبني ومتعني">
    <meta property="og:description" content="العب Ultimate Tic-Tac-Toe أونلاين مع أصدقائك أو ضد البوت الذكي بتطوير مازن">
    <meta property="og:image" content="https://vermillion-horse-064abc.netlify.app/preview.png">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://vermillion-horse-064abc.netlify.app/preview.png">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #222831;
            color: #eceff1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 5px 0;
            color: #00adb5;
            font-size: 2.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .developer {
            font-size: 1rem;
            color: #b2bec3;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .menu-container {
            background-color: #11141a;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 380px;
            max-width: 90vw;
            margin-bottom: 20px;
        }

        .menu-container input, .menu-container button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .menu-container input {
            background-color: #393e46;
            color: #fff;
            text-align: center;
            border: 1px solid #4f5660;
        }

        .menu-container input:focus {
            border-color: #00adb5;
        }

        .menu-container input::placeholder {
            color: #9aa0a6;
            opacity: 1;
        }

        .btn-bot { background-color: #ff2e63; color: white; cursor: pointer; font-weight: bold;}
        .btn-online { background-color: #00adb5; color: white; cursor: pointer; font-weight: bold;}
        .btn-secondary { background-color: #4f5660; color: white; cursor: pointer;}
        .btn-copy { background-color: #20bf6b; color: white; cursor: pointer; font-weight: bold; font-size: 0.9rem;}
        
        /* أزرار مستويات الصعوبة */
        .btn-easy { background-color: #20bf6b; color: white; cursor: pointer; font-weight: bold; }
        .btn-medium { background-color: #f7b731; color: white; cursor: pointer; font-weight: bold; }
        .btn-hard { background-color: #eb3b5a; color: white; cursor: pointer; font-weight: bold; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(235, 59, 90, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(235, 59, 90, 0); }
            100% { box-shadow: 0 0 0 0 rgba(235, 59, 90, 0); }
        }

        .btn-restart {
            background-color: #20bf6b;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(32, 191, 107, 0.4);
            transition: all 0.2s;
            width: 100%;
            max-width: 450px;
        }
        .btn-restart:hover {
            background-color: #26de81;
            transform: scale(1.02);
        }

        .btn-exit-game {
            background-color: #ff2e63;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 46, 99, 0.3);
            transition: all 0.2s;
            width: 100%;
            max-width: 450px;
        }
        .btn-exit-game:hover {
            background-color: #ff4775;
            transform: scale(1.02);
        }

        .hidden { display: none !important; }

        #status {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: bold;
            background: #11141a;
            padding: 10px 25px;
            border-radius: 20px;
            border: 1px solid #393e46;
        }

        .players-bar {
            display: flex;
            justify-content: space-between;
            width: 450px;
            max-width: 95vw;
            margin-bottom: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            background: #11141a;
            padding: 8px 15px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .player-score { padding: 4px 10px; border-radius: 4px; }
        .player-score.x-side { color: #ff2e63; }
        .player-score.o-side { color: #00adb5; }

        .main-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            background-color: #11141a;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 450px;
            height: 450px;
            max-width: 95vw;
            max-height: 95vw;
            box-sizing: border-box;
        }

        .big-square {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            background-color: #393e46;
            padding: 4px;
            border: 3px solid transparent;
            transition: all 0.3s ease;
            position: relative;
            box-sizing: border-box;
            border-radius: 6px;
        }

        .big-square.active {
            border-color: #00adb5 !important;
            box-shadow: 0 0 15px rgba(0, 173, 181, 0.6) !important;
        }

        .small-cell {
            background-color: #222831;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
            box-sizing: border-box;
            border-radius: 6px;
            z-index: 2;
        }

        .small-cell:hover { background-color: #393e46; }
        .small-cell.X { color: #ff2e63; }
        .small-cell.O { color: #00adb5; }

        .big-square.won-X { 
            background-color: #4a1525;
            border-color: #ff2e63;
        }
        .big-square.won-O { 
            background-color: #0f3443;
            border-color: #00adb5;
        }
        .big-square.won-Tie {
            background-color: #2c3e50;
            border-color: #7f8c8d;
        }
        
        .big-square.won-X::after {
            content: 'X'; position: absolute; top:0; left:0; width:100%; height:100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 8rem; font-weight: bold; 
            color: rgba(255, 46, 99, 0.15);
            pointer-events: none;
            z-index: 1;
        }
        .big-square.won-O::after {
            content: 'O'; position: absolute; top:0; left:0; width:100%; height:100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 8rem; font-weight: bold; 
            color: rgba(0, 173, 181, 0.15);
            pointer-events: none;
            z-index: 1;
        }

        .big-square:not(.active) .small-cell {
            cursor: not-allowed;
            opacity: 0.5;
        }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <h1>لعبني ومتعني</h1>
    <div class="developer">بتطوير مازن</div>

    <div class="menu-container" id="nameMenu">
        <h3>مرحباً بك في اللعبة</h3>
        <p style="font-size: 0.9rem; color: #b2bec3; margin-bottom: 5px;">أدخل اسمك أولاً للبدء:</p>
        <input type="text" id="playerNameInput" placeholder="اكتب اسمك هنا..." value="">
        <button class="btn-bot" onclick="goToModeMenu()">تأكيد الاسم والمتابعة</button>
    </div>

    <div class="menu-container hidden" id="startMenu">
        <h3 id="welcomeMessage">أهلاً بك</h3>
        <button class="btn-bot" onclick="showDifficultyMenu()">اللعب ضد البوت (ذكاء اصطناعي)</button>
        <hr style="border-color: #393e46; margin: 15px 0;">
        <button class="btn-online" onclick="showOnlineMenu()">اللعب أونلاين مع صديق</button>
        <button class="btn-secondary" onclick="backToNameMenu()">تغيير الاسم</button>
    </div>

    <div class="menu-container hidden" id="difficultyMenu">
        <h3>اختر مستوى صعوبة البوت</h3>
        <p style="font-size: 0.9rem; color: #b2bec3; margin-bottom: 15px;">حدد مدى قوة الذكاء الاصطناعي للخصم:</p>
        <button class="btn-easy" onclick="startBotMode('easy')">🟢 مبتدئ (سهل وعشوائي)</button>
        <button class="btn-medium" onclick="startBotMode('medium')">🟡 متوسط (تحدي متوازن)</button>
        <button class="btn-hard" onclick="startBotMode('legendary')">🔴 أسطوري (ذكي جداً ولا يرحم)</button>
        <hr style="border-color: #393e46; margin: 15px 0;">
        <button class="btn-secondary" onclick="backToStartMenu()">رجوع للخلف</button>
    </div>

    <div class="menu-container hidden" id="onlineMenu">
        <h3>نمط الأونلاين المباشر</h3>
        
        <button class="btn-online" onclick="initHost()">إنشاء غرفة جديدة وتوليد ID</button>
        <div id="roomIDDisplay" style="margin: 5px 0; font-weight: bold; color: #00adb5; font-size: 1.4rem; letter-spacing: 2px;"></div>
        <button id="copyBtn" class="btn-copy hidden" onclick="copyRoomID()">📋 نسخ رقم الـ ID</button>
        
        <hr style="border-color: #393e46; margin: 15px 0;">
        
        <p style="font-size: 0.9rem; color: #b2bec3; margin: 5px 0;">أدخل الـ ID المكون من 4 أرقام:</p>
        <input type="number" id="joinRoomID" placeholder="مثال: 1234" oninput="if(this.value.length > 4) this.value = this.value.slice(0,4);">
        <button class="btn-bot" onclick="initJoin()">دخول الغرفة واللعب فوراً</button>
        
        <button class="btn-secondary" onclick="backToMain()">رجوع للرئيسية</button>
    </div>

    <div id="gameZone" class="hidden" style="text-align: center;">
        <div class="players-bar">
            <span class="player-score x-side" id="p1Display">اللاعب 1 (X)</span>
            <span style="color: #b2bec3;">VS</span>
            <span class="player-score o-side" id="p2Display">اللاعب 2 (O)</span>
        </div>
        <div id="status">جاري التهيئة...</div>
        <div class="main-board" id="mainBoard"></div>
        
        <button id="restartBtn" class="btn-restart hidden" onclick="resetToMainMenu()">🔄 العودة إلى القائمة الرئيسية</button>
        <button id="exitGameBtn" class="btn-exit-game" onclick="exitActiveGame()">🚪 خروج والعودة للقائمة الرئيسية</button>
    </div>

    <script>
        const statusDisplay = document.getElementById('status');
        const restartBtn = document.getElementById('restartBtn');
        const exitGameBtn = document.getElementById('exitGameBtn');
        let peer;
        let conn;
        let gameMode = ''; 
        let botDifficulty = 'medium'; // 🌟 متغير جديد لحفظ الصعوبة المحددة
        let mySymbol = 'X'; 
        let currentPlayer = 'X';
        let activeBigSquare = null; 
        let isBotThinking = false;
        let myName = "لاعب 1";
        let opponentName = "الخصم";
        let isGameOver = false;

        let boardState = Array(9).fill(null).map(() => Array(9).fill(null));
        let bigBoardWinners = Array(9).fill(null);

        const winConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        const mainBoard = document.getElementById('mainBoard');
        for (let b = 0; b < 9; b++) {
            const bigSq = document.createElement('div');
            bigSq.className = 'active big-square';
            bigSq.dataset.bigIndex = b;
            for (let s = 0; s < 9; s++) {
                const smallCell = document.createElement('div');
                smallCell.className = 'small-cell';
                smallCell.dataset.big = b;
                smallCell.dataset.small = s;
                smallCell.addEventListener('click', handleCellClick);
                bigSq.appendChild(smallCell);
            }
            mainBoard.appendChild(bigSq);
        }

        function goToModeMenu() {
            const inputVal = document.getElementById('playerNameInput').value.trim();
            myName = inputVal ? inputVal : "لاعب 1";
            
            document.getElementById('welcomeMessage').textContent = `أهلاً بك يا ${myName} 👋`;
            document.getElementById('nameMenu').classList.add('hidden');
            document.getElementById('startMenu').classList.remove('hidden');
        }

        function backToNameMenu() {
            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('nameMenu').classList.remove('hidden');
        }

        function showDifficultyMenu() {
            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('difficultyMenu').classList.remove('hidden');
        }

        function backToStartMenu() {
            document.getElementById('difficultyMenu').classList.add('hidden');
            document.getElementById('startMenu').classList.remove('hidden');
        }

        function showOnlineMenu() {
            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('onlineMenu').classList.remove('hidden');
        }

        function backToMain() {
            document.getElementById('onlineMenu').classList.add('hidden');
            document.getElementById('startMenu').classList.remove('hidden');
        }

        function startBotMode(difficulty) {
            gameMode = 'bot';
            botDifficulty = difficulty; // حفظ الصعوبة
            mySymbol = 'X';
            
            // تخصيص اسم البوت بناءً على الصعوبة المبرمجة
            if(difficulty === 'easy') opponentName = "البوت المبتدئ 🟢";
            else if(difficulty === 'medium') opponentName = "البوت المتوسط 🟡";
            else opponentName = "البوت الأسطوري 🔥🔴";

            isGameOver = false;
            restartBtn.classList.add('hidden');
            exitGameBtn.classList.remove('hidden');
            
            document.getElementById('p1Display').textContent = `${myName} (X)`;
            document.getElementById('p2Display').textContent = `${opponentName} (O)`;
            
            document.getElementById('difficultyMenu').classList.add('hidden');
            document.getElementById('gameZone').classList.remove('hidden');
            statusDisplay.textContent = "دورك الآن، إلعب حركتك!";
        }

        function initHost() {
            gameMode = 'online';
            mySymbol = 'X';
            isGameOver = false;
            restartBtn.classList.add('hidden');
            exitGameBtn.classList.remove('hidden');
            const fourDigitID = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(fourDigitID);

            statusDisplay.textContent = "جاري إنشاء الغرفة وتوليد الـ ID...";

            peer.on('open', (id) => {
                document.getElementById('roomIDDisplay').textContent = `رقم الـ ID: ${id}`;
                document.getElementById('copyBtn').classList.remove('hidden');
                statusDisplay.textContent = "بانتظار دخول صديقك للغرفة...";
            });

            peer.on('error', (err) => {
                if(err.type === 'unavailable-id') {
                    initHost();
                } else {
                    statusDisplay.textContent = "حدث خطأ بالشبكة، يرجى المحاولة مرة أخرى.";
                }
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                setTimeout(() => {
                    conn.send({ type: 'init-names', hostName: myName });
                }, 600);
            });
        }

        function initJoin() {
            gameMode = 'online';
            mySymbol = 'O';
            isGameOver = false;
            restartBtn.classList.add('hidden');
            exitGameBtn.classList.remove('hidden');
            const targetID = document.getElementById('joinRoomID').value.trim();
            if (!targetID) return alert("الرجاء إدخال رقم الـ ID الخاص بصديقك أولاً!");

            statusDisplay.textContent = "جاري الاتصال بالغرفة...";
            peer = new Peer();
            
            peer.on('open', () => {
                conn = peer.connect(targetID);
                setupConnection();
            });
        }

        function copyRoomID() {
            const idText = document.getElementById('roomIDDisplay').textContent.replace('رقم الـ ID: ', '');
            navigator.clipboard.writeText(idText);
            alert("تم نسخ الـ ID بنجاح!");
        }

        function setupConnection() {
            conn.on('data', (data) => {
                if (data.type === 'init-names') {
                    opponentName = data.hostName;
                    conn.send({ type: 'reply-names', guestName: myName });
                    startGameLoop();
                } else if (data.type === 'reply-names') {
                    opponentName = data.guestName;
                    startGameLoop();
                } else if (data.type === 'move') {
                    makeMoveOnBoard(data.bigIndex, data.smallIndex, data.player);
                } else if (data.type === 'restart-game') {
                    executeReset();
                } else if (data.type === 'exit-match') {
                    alert("لقد قام الخصم بالخروج من المباراة والانسحاب!");
                    executeReset();
                }
            });

            conn.on('open', () => {
                statusDisplay.textContent = "تم الاتصال المباشر! جاري تبادل الأسماء...";
            });
        }

        function startGameLoop() {
            document.getElementById('onlineMenu').classList.add('hidden');
            document.getElementById('gameZone').classList.remove('hidden');
            
            if(mySymbol === 'X') {
                document.getElementById('p1Display').textContent = `${myName} (X)`;
                document.getElementById('p2Display').textContent = `${opponentName} (O)`;
            } else {
                document.getElementById('p1Display').textContent = `${opponentName} (X)`;
                document.getElementById('p2Display').textContent = `${myName} (O)`;
            }

            updateStatusText();
        }

        function updateStatusText() {
            if (isGameOver) return;
            if (currentPlayer === mySymbol) {
                statusDisplay.textContent = "دورك الآن، إلعب حركتك!";
                statusDisplay.style.color = mySymbol === 'X' ? '#ff2e63' : '#00adb5';
            } else {
                statusDisplay.textContent = `دور ${opponentName} حالياً، انتظر...`;
                statusDisplay.style.color = '#b2bec3';
            }
        }

        function handleCellClick(e) {
            if (isBotThinking || isGameOver) return; 

            const bigIndex = parseInt(e.target.dataset.big);
            const smallIndex = parseInt(e.target.dataset.small);

            if (gameMode === 'online' && currentPlayer !== mySymbol) return; 
            if (activeBigSquare !== null && activeBigSquare !== bigIndex) return;
            if (boardState[bigIndex][smallIndex] !== null) return;

            if (gameMode === 'online' && conn) {
                conn.send({ type: 'move', bigIndex, smallIndex, player: mySymbol });
            }
            makeMoveOnBoard(bigIndex, smallIndex, currentPlayer);
        }

        function makeMoveOnBoard(bigIndex, smallIndex, player) {
            boardState[bigIndex][smallIndex] = player;
            
            const cell = document.querySelector(`[data-big="${bigIndex}"][data-small="${smallIndex}"]`);
            if (cell) {
                cell.textContent = player;
                cell.classList.add(player);
            }

            if (bigBoardWinners[bigIndex] === null) {
                if (checkWin(boardState[bigIndex], player)) {
                    bigBoardWinners[bigIndex] = player;
                    document.querySelector(`[data-big-index="${bigIndex}"]`).classList.add(`won-${player}`);
                    
                    if (checkWin(bigBoardWinners, player)) {
                        isGameOver = true;
                        let winnerRealName = (player === mySymbol) ? myName : opponentName;
                        statusDisplay.textContent = `🎉 انتهت اللعبة! الفائز هو: ${winnerRealName}`;
                        statusDisplay.style.color = '#20bf6b';
                        restartBtn.classList.remove('hidden'); 
                        exitGameBtn.classList.add('hidden'); 
                        return;
                    }
                } else if (isSquareFull(bigIndex)) {
                    bigBoardWinners[bigIndex] = 'Tie';
                    document.querySelector(`[data-big-index="${bigIndex}"]`).classList.add('won-Tie');
                }
            }

            if (boardState.every((sq, idx) => isSquareFull(idx))) {
                isGameOver = true;
                statusDisplay.textContent = "🤝 تعادل! انتهت كافة المربعات.";
                statusDisplay.style.color = '#b2bec3';
                restartBtn.classList.remove('hidden');
                exitGameBtn.classList.add('hidden');
                return;
            }

            let nextBigSquare = smallIndex;
            
            if (isSquareFull(nextBigSquare)) {
                activeBigSquare = null; 
            } else {
                activeBigSquare = nextBigSquare;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            
            updateStatusText();
            updateActiveVisuals();

            if (gameMode === 'bot' && currentPlayer === 'O' && !isBotThinking && !isGameOver) {
                isBotThinking = true;
                setTimeout(botPlay, 700);
            }
        }

        /* 🧠 الخوارزمية المحدثة للتحكم بمستويات ذكاء وصعوبة البوت */
        function botPlay() {
            let validCells = [];
            
            document.querySelectorAll('.small-cell').forEach(cell => {
                const b = parseInt(cell.dataset.big);
                const s = parseInt(cell.dataset.small);
                if (boardState[b][s] === null) {
                    if (activeBigSquare === null || activeBigSquare === b) {
                        validCells.push({ b, s });
                    }
                }
            });

            if (validCells.length === 0) {
                isBotThinking = false;
                return;
            }

            // 🎲 حساب نسبة العشوائية حسب المستوى
            let randomChance = Math.random();
            let forceRandom = false;

            if (botDifficulty === 'easy') {
                // المبتدئ يلعب عشوائي بنسبة 85% من الوقت
                if (randomChance < 0.85) forceRandom = true;
            } else if (botDifficulty === 'medium') {
                // المتوسط يلعب عشوائي بنسبة 45% من الوقت ليعطي فرصة للاعب
                if (randomChance < 0.45) forceRandom = true;
            }
            // الأسطوري (legendary) نسبته 0% عشوائي، دائماً يلعب بأقصى ذكاء

            if (!forceRandom) {
                // أولاً: الهجوم - الفوز بالمربع الصغير فوراً
                for (let cell of validCells) {
                    let tempBoard = [...boardState[cell.b]];
                    tempBoard[cell.s] = 'O'; 
                    if (checkWin(tempBoard, 'O')) {
                        isBotThinking = false;
                        makeMoveOnBoard(cell.b, cell.s, 'O');
                        return; 
                    }
                }

                // ثانياً: الدفاع - قفل المربع على اللاعب X ومنعه من الفوز به
                for (let cell of validCells) {
                    let tempBoard = [...boardState[cell.b]];
                    tempBoard[cell.s] = 'X'; 
                    if (checkWin(tempBoard, 'X')) {
                        isBotThinking = false;
                        makeMoveOnBoard(cell.b, cell.s, 'O');
                        return; 
                    }
                }

                // ثالثاً: استراتيجية التوجيه للأماكن المفضلة وغير الخطيرة
                let bestMoves = validCells.filter(cell => {
                    let targetBigSquare = cell.s; 
                    return !isSquareFull(targetBigSquare) && bigBoardWinners[targetBigSquare] === null;
                });

                if (bestMoves.length > 0) {
                    const move = bestMoves[Math.floor(Math.random() * bestMoves.length)];
                    isBotThinking = false;
                    makeMoveOnBoard(move.b, move.s, 'O');
                    return;
                }
            }

            // رابعاً: في حال تفعيل العشوائية أو لم يجد حركة تكتيكية، يلعب عشوائياً
            const move = validCells[Math.floor(Math.random() * validCells.length)];
            isBotThinking = false; 
            makeMoveOnBoard(move.b, move.s, 'O');
        }

        function checkWin(board, player) {
            return winConditions.some(combination => {
                return combination.every(index => board[index] === player);
            });
        }

        function isSquareFull(bigIndex) {
            return boardState[bigIndex].every(cell => cell !== null);
        }

        function updateActiveVisuals() {
            const bigSquares = document.querySelectorAll('.big-square');
            bigSquares.forEach((sq, idx) => {
                if ((activeBigSquare === null || activeBigSquare === idx) && !isSquareFull(idx)) {
                    sq.classList.add('active');
                } else {
                    sq.classList.remove('active');
                }
            });
        }

        function resetToMainMenu() {
            if (gameMode === 'online' && conn) {
                conn.send({ type: 'restart-game' });
            }
            executeReset();
        }

        function exitActiveGame() {
            if (confirm("هل أنت متأكد من رغبتك في الخروج من المباراة الحالية والعودة للرئيسية؟")) {
                if (gameMode === 'online' && conn) {
                    conn.send({ type: 'exit-match' });
                }
                executeReset();
            }
        }

        function executeReset() {
            boardState = Array(9).fill(null).map(() => Array(9).fill(null));
            bigBoardWinners = Array(9).fill(null);
            activeBigSquare = null;
            currentPlayer = 'X';
            isGameOver = false;
            isBotThinking = false;

            restartBtn.classList.add('hidden');
            exitGameBtn.classList.add('hidden');
            document.getElementById('gameZone').classList.add('hidden');
            document.getElementById('startMenu').classList.remove('hidden');

            document.querySelectorAll('.small-cell').forEach(cell => {
                cell.textContent = '';
                cell.className = 'small-cell';
            });
            document.querySelectorAll('.big-square').forEach(sq => {
                sq.className = 'active big-square';
            });
        }
    </script>
</body>
